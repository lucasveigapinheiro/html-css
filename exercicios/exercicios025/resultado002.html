<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Login</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease;
        }

        .success-icon {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 20px;
            animation: bounceIn 1s ease;
        }

        h1 {
            color: #667eea;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .data-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
            animation: slideInLeft 0.8s ease;
        }

        .data-label {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .data-value {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .timestamp {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 20px;
            font-style: italic;
        }

        .error-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-left-color: #e74c3c;
        }

        .error-card .data-value {
            color: #e74c3c;
        }

        .success-card {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-left-color: #27ae60;
        }

        .success-card .data-value {
            color: #27ae60;
        }

        .password-mask {
            letter-spacing: 3px;
            font-family: monospace;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-icon">🔐</div>
        <h1>Login Processado!</h1>

        <div id="dados-container">
            <!-- Os dados serão inseridos aqui pelo JavaScript -->
        </div>

        <div class="timestamp" id="timestamp">
            <!-- Data e hora serão inseridas aqui pelo JavaScript -->
        </div>

        <div style="text-align: center;">
            <a href="formularios002.html" class="back-button">Voltar ao Login</a>
        </div>
    </div>

    <script>
        // Função para obter parâmetros da URL (GET)
        function obterDadosGET() {
            const params = new URLSearchParams(window.location.search);
            return {
                usuario: params.get('usu'),
                senha: params.get('sen'),
                email: params.get('email'),
                telefone: params.get('tel')
            };
        }

        // Função para escapar HTML (segurança)
        function escaparHTML(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // Função para mascarar senha
        function mascararSenha(senha) {
            if (!senha) return 'Não informada';
            return '•'.repeat(senha.length);
        }

        // Função para mascarar email
        function mascararEmail(email) {
            if (!email) return 'Não informado';
            const [usuario, dominio] = email.split('@');
            if (!usuario || !dominio) return email;

            const usuarioMascarado = usuario.charAt(0) + '***' + usuario.charAt(usuario.length - 1);
            return usuarioMascarado + '@' + dominio;
        }

        // Função para formatar telefone
        function formatarTelefone(telefone) {
            if (!telefone) return 'Não informado';
            // Remove caracteres não numéricos
            const numeros = telefone.replace(/\D/g, '');

            // Formata (00) 00000-0000
            if (numeros.length === 11) {
                return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 7)}-${numeros.slice(7)}`;
            } else if (numeros.length === 10) {
                return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 6)}-${numeros.slice(6)}`;
            }
            return telefone;
        }

        // Função para formatar data e hora
        function formatarDataHora() {
            const agora = new Date();
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');

            return `${dia}/${mes}/${ano} ${horas}:${minutos}:${segundos}`;
        }

        // Função principal para processar e exibir os dados
        function processarDados() {
            const dados = obterDadosGET();
            const container = document.getElementById('dados-container');

            if (dados.usuario || dados.senha || dados.email || dados.telefone) {
                let html = '';

                // Card Usuário
                if (dados.usuario) {
                    html += '<div class="data-card">';
                    html += '<div class="data-label">Usuário:</div>';
                    html += '<div class="data-value">' + escaparHTML(dados.usuario) + '</div>';
                    html += '</div>';
                }

                // Card Senha (mascarada)
                if (dados.senha) {
                    html += '<div class="data-card">';
                    html += '<div class="data-label">Senha:</div>';
                    html += '<div class="data-value password-mask">' + mascararSenha(dados.senha) + '</div>';
                    html += '</div>';
                }

                // Card Email (mascarado)
                if (dados.email) {
                    html += '<div class="data-card">';
                    html += '<div class="data-label">Email:</div>';
                    html += '<div class="data-value">' + mascararEmail(dados.email) + '</div>';
                    html += '</div>';
                }

                // Card Telefone (formatado)
                if (dados.telefone) {
                    html += '<div class="data-card">';
                    html += '<div class="data-label">Telefone:</div>';
                    html += '<div class="data-value">' + formatarTelefone(dados.telefone) + '</div>';
                    html += '</div>';
                }

                // Card Status
                html += '<div class="data-card success-card">';
                html += '<div class="data-label">Status:</div>';
                html += '<div class="data-value">Dados Recebidos com Sucesso!</div>';
                html += '</div>';

                // Card Método
                html += '<div class="data-card" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); border-left-color: #6c5ce7;">';
                html += '<div class="data-label">Método:</div>';
                html += '<div class="data-value" style="color: #6c5ce7;">GET</div>';
                html += '</div>';

                // Card Segurança
                html += '<div class="data-card" style="background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%); border-left-color: #f39c12;">';
                html += '<div class="data-label">Segurança:</div>';
                html += '<div class="data-value" style="color: #f39c12;">Dados Protegidos</div>';
                html += '</div>';

                container.innerHTML = html;

            } else {
                // Não tem dados - exibir erro
                let html = '';
                html += '<div class="data-card error-card">';
                html += '<div class="data-label">Erro:</div>';
                html += '<div class="data-value">Nenhum dado recebido!</div>';
                html += '</div>';

                html += '<div class="data-card" style="background: linear-gradient(135deg, #dfe6e9 0%, #b2bec3 100%); border-left-color: #636e72;">';
                html += '<div class="data-label">Observação:</div>';
                html += '<div class="data-value" style="color: #636e72; font-size: 1rem;">Preencha o formulário e envie novamente.</div>';
                html += '</div>';

                container.innerHTML = html;
            }

            // Atualizar timestamp
            document.getElementById('timestamp').textContent = 'Data e Hora: ' + formatarDataHora();
        }

        // Executar quando a página carregar
        document.addEventListener('DOMContentLoaded', processarDados);
    </script>
</body>

</html>
